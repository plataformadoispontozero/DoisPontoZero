name: Dois.Zero CI Pipeline

on:
  push:
    branches: [ principal, main, 'release/**', 'feat/**', 'codex/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Code Quality, Security & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking (tsc -b)
        run: npx tsc -b

      - name: Code Quality Audit (oxlint)
        run: npx oxlint

      - name: Execute Vitest Automated Test Suite
        run: npm run test -- --maxWorkers=2

      - name: Production Bundle Verification (Vite Build)
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL;
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY || process.env.VITE_SUPABASE_ANON_KEY;
          if (!url || !key || !url.startsWith('https://') || key.includes('sua-chave')) {
            throw new Error('Configure public Supabase URL and publishable/anon key in repository Actions variables before building a release candidate.');
          }
          NODE
          npm run build
        env:
          VITE_APP_ENV: production
          VITE_ENABLE_DIGITAL_OFFICE: 'true'
          VITE_ENABLE_OFFICE_CONTROLS: 'true'
          VITE_ENABLE_OFFICE_CALLS: 'false'
          VITE_ENABLE_OFFICE_MEDIA: 'false'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Cloudflare bundle without publishing
        run: npx wrangler deploy --dry-run --outdir /tmp/dois-worker-dry-run

      - name: Save release candidate
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist
          retention-days: 7
